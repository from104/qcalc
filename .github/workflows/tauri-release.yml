name: tauri-release

# Tauri 2 데스크톱 빌드 릴리스 워크플로. Electron 릴리스와 분리된 태그 스킴(`tauri-v*`)을 사용한다.
#
# 사전 준비 (1회):
#   1. `yarn tauri signer generate -w ~/.tauri/qcalc.key` 로 서명 키 생성
#   2. 공개키 내용을 `src-tauri/tauri.conf.json`의 `plugins.updater.pubkey`에 붙여넣기
#   3. GitHub Repo Settings > Secrets > Actions 에 다음 secret 추가:
#      - TAURI_SIGNING_PRIVATE_KEY         : 개인키 파일 (~/.tauri/qcalc.key) 내용
#      - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 개인키 생성 시 설정한 암호
#
# 릴리스 절차:
#   git tag tauri-v0.12.2 && git push origin tauri-v0.12.2
#   → 이 워크플로가 실행되어 .deb/.AppImage + .sig + latest.json 을 draft 릴리스로 업로드.

on:
  push:
    tags:
      - 'tauri-v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and release Tauri bundle (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            build-essential

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QCalc Tauri ${{ github.ref_name }}'
          releaseBody: 'Tauri 2 데스크톱 빌드. 전체 변경 이력은 CHANGELOG를 참조하세요.'
          releaseDraft: true
          prerelease: false
