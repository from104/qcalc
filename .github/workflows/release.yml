name: release

# Tauri 2 데스크톱 프로덕션 릴리스 워크플로. Tauri 가 데스크톱 빌드의 유일한 경로이므로
# 일반 버전 태그(`v*`)를 그대로 사용한다.
#
# 사전 준비 (1회):
#   1. `yarn tauri signer generate -w ~/.tauri/qcalc.key` 로 서명 키 생성
#   2. 공개키 내용을 `src-tauri/tauri.conf.json`의 `plugins.updater.pubkey`에 붙여넣기
#   3. GitHub Repo Settings > Secrets > Actions 에 다음 secret 추가:
#      - TAURI_SIGNING_PRIVATE_KEY         : 개인키 파일 (~/.tauri/qcalc.key) 내용
#      - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 개인키 생성 시 설정한 암호
#
# 릴리스 절차:
#   git tag v0.13.0 && git push origin v0.13.0
#   → 이 워크플로가 실행되어 .deb/.rpm/.AppImage/.exe(NSIS) + .flatpak + .snap
#     + .sig + latest.json 을 draft 릴리스로 업로드.
#   → draft 릴리스를 검증·Publish 한 뒤, tauri-updater-promote 워크플로를 실행해
#     latest.json 을 고정 'tauri-updater' 롤링 릴리스로 복사해야 업데이터가 동작한다.
#
# workflow_dispatch 로 수동 실행하면 태그 없이 전 포맷을 빌드해 아티팩트로만 업로드한다
# (릴리스 미생성). 이 브랜치의 CI 빌드 검증 수단으로 사용한다.

on:
  push:
    tags:
      - 'v*'
    # TODO(0.13.0): 머지 전 제거 — 브랜치에서 전 포맷 CI 빌드를 검증하기 위한 임시 트리거.
    # 릴리스/테스트 분기는 ref가 태그인지로 판별하므로 브랜치 push는 항상 테스트 모드다.
    branches:
      - feature/0.13.0-tauri-main
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Tauri bundle (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ubuntu-22.04(glibc 2.35) 고정: ubuntu-latest(24.04, glibc 2.39)로 빌드하면
          # 구형 배포판에서 실행 불가한 바이너리가 나온다. deb/rpm/AppImage 세 포맷 모두
          # bundle.targets: "all"(tauri.conf.json)로 커버되므로 --bundles 로 명시한다.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
          # bundle.targets: "all"(tauri.conf.json)이면 Windows에서 NSIS+MSI 둘 다
          # 생성되므로 --bundles nsis 로 NSIS(.exe)만 산출하도록 제한한다.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Build Tauri bundle
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CI 컨테이너에는 FUSE 가 없어 AppImage 번들링(appimagetool) 시 필요.
          # Linux 이외 플랫폼에서는 아무 효과 없음.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # 태그 push일 때만 릴리스 생성 — 그 외(workflow_dispatch·브랜치 push)는 빌드만 하는 테스트 모드.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'QCalc ${{ github.ref_name }}'
          releaseBody: 'Tauri 2 데스크톱 빌드. 전체 변경 이력은 CHANGELOG를 참조하세요.'
          releaseDraft: true
          prerelease: false
          # deb/rpm/AppImage(Linux)·NSIS(Windows) 번들 타깃은 matrix.platform.args 로 지정.
          args: ${{ matrix.platform.args }}

      - name: Upload bundles as artifacts (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.platform.target }}
          path: src-tauri/target/release/bundle/**
          retention-days: 7

      # flatpak/snap 잡은 GitHub 릴리스가 아니라 이 워크플로 아티팩트에서 .deb를
      # 가져온다 (태그 push와 workflow_dispatch 양쪽에서 동일하게 소비 가능하도록
      # 이벤트 종류와 무관하게 매번 업로드한다).
      - name: Upload deb artifact (linux only)
        if: matrix.platform.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-deb-linux
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 3

  build-flatpak:
    name: Build Flatpak bundle
    needs: build-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: tauri-deb-linux
          path: flatpak/

      - name: Prepare sources
        run: |
          mv flatpak/*.deb flatpak/qcalc.deb
          mkdir -p flatpak/icons
          cp src-tauri/icons/128x128@2x.png flatpak/icons/io.github.from104.qcalc.png

      - name: Setup Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build Flatpak
        run: |
          cd flatpak
          flatpak-builder --force-clean --user --install-deps-from=flathub --disable-updates --repo=repo .flatpak-builder/build io.github.from104.qcalc.yml

      - name: Bundle
        run: |
          cd flatpak
          VER=$(node -p "require('../package.json').version")
          flatpak build-bundle repo "Q-Calc-${VER}-linux.flatpak" io.github.from104.qcalc

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" flatpak/Q-Calc-*.flatpak --clobber

      - name: Upload artifact (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: flatpak/Q-Calc-*.flatpak
          retention-days: 7

  build-snap:
    name: Build Snap bundle
    needs: build-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: tauri-deb-linux
          path: snap/local/

      - name: Rename deb
        run: mv snap/local/*.deb snap/local/qcalc.deb

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapbuild

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.snapbuild.outputs.snap }}" --clobber

      - name: Upload artifact (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: snap-bundle
          path: ${{ steps.snapbuild.outputs.snap }}
          retention-days: 7
