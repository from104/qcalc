name: release

# 데스크톱(Tauri 2) + 안드로이드(Capacitor) 프로덕션 릴리스 워크플로.
# Tauri 가 데스크톱 빌드의 유일한 경로이므로 일반 버전 태그(`v*`)를 그대로 사용한다.
#
# 사전 준비 (1회):
#   1. `yarn tauri signer generate -w ~/.tauri/qcalc.key` 로 서명 키 생성
#   2. 공개키 내용을 `src-tauri/tauri.conf.json`의 `plugins.updater.pubkey`에 붙여넣기
#   3. GitHub Repo Settings > Secrets > Actions 에 다음 secret 추가:
#      - TAURI_SIGNING_PRIVATE_KEY         : 개인키 파일 (~/.tauri/qcalc.key) 내용
#      - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 개인키 생성 시 설정한 암호
#      - MY_JKS_BASE64                     : 안드로이드 서명 키스토어를 base64 로 인코딩한 값
#                                            (`base64 -w0 <키스토어>.jks`)
#      - MY_JKS_STORE_PASSWORD             : 키스토어 암호
#      - MY_JKS_KEY_ALIAS                  : 키 별칭
#      - MY_JKS_KEY_PASSWORD               : 키 암호
#      안드로이드 4종이 없으면 build-android 잡이 어떤 시크릿이 비었는지 찍고 실패한다.
#      서명되지 않은 APK 를 조용히 내보내느니 요란하게 실패하는 쪽을 택한 것이다.
#
# 릴리스 절차:
#   git tag v0.13.0 && git push origin v0.13.0
#   → 이 워크플로가 실행되어 .deb/.rpm/.AppImage/.exe(NSIS) + .flatpak + .snap
#     + .apk + .sig + latest.json 을 draft 릴리스로 업로드.
#   → draft 릴리스를 검증·Publish 한 뒤, tauri-updater-promote 워크플로를 실행해
#     latest.json 을 고정 'tauri-updater' 롤링 릴리스로 복사해야 업데이터가 동작한다.
#
# workflow_dispatch 로 수동 실행하면 태그 없이 전 포맷을 빌드해 아티팩트로만 업로드한다
# (릴리스 미생성). 이 브랜치의 CI 빌드 검증 수단으로 사용한다.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Tauri bundle (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ubuntu-22.04(glibc 2.35) 고정: ubuntu-latest(24.04, glibc 2.39)로 빌드하면
          # 구형 배포판에서 실행 불가한 바이너리가 나온다. deb/rpm/AppImage 세 포맷 모두
          # bundle.targets: "all"(tauri.conf.json)로 커버되므로 --bundles 로 명시한다.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
          # bundle.targets: "all"(tauri.conf.json)이면 Windows에서 NSIS+MSI 둘 다
          # 생성되므로 --bundles nsis 로 NSIS(.exe)만 산출하도록 제한한다.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Build Tauri bundle
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CI 컨테이너에는 FUSE 가 없어 AppImage 번들링(appimagetool) 시 필요.
          # Linux 이외 플랫폼에서는 아무 효과 없음.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # 태그 push일 때만 릴리스 생성 — 그 외(workflow_dispatch·브랜치 push)는 빌드만 하는 테스트 모드.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'QCalc ${{ github.ref_name }}'
          releaseBody: 'Tauri 2 데스크톱 빌드. 전체 변경 이력은 CHANGELOG를 참조하세요.'
          releaseDraft: true
          prerelease: false
          # deb/rpm/AppImage(Linux)·NSIS(Windows) 번들 타깃은 matrix.platform.args 로 지정.
          args: ${{ matrix.platform.args }}

      # 0.12.0까지 배포한 Electron 빌드는 electron-updater를 쓴다. 그쪽은 릴리스에서
      # latest.yml(Windows)·latest-linux.yml(AppImage)을 읽는데, Tauri 업데이터는
      # latest.json을 쓴다. 이 파일이 없으면 옛 사용자는 업데이트 확인 때마다 404를
      # 보고 **새 버전이 나온 사실을 영영 모른다** — 0.13.0이 실제로 그랬다.
      # 그래서 Tauri 산출물을 가리키는 electron-updater 매니페스트를 함께 올린다.
      # 옛 설치 폴더와 같은 자리에 덮어써지므로(installer-hooks.nsh 참조) 제자리
      # 업그레이드가 된다. Electron 트랙 사용자가 모두 넘어오면 지워도 된다.
      - name: Publish electron-updater manifest (legacy 0.12.x clients)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            manifest=latest.yml
            artifact=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          else
            manifest=latest-linux.yml
            artifact=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          fi
          name=$(basename "$artifact")
          # GitHub은 자산 이름의 공백을 점으로 바꿔 저장한다. 매니페스트의 url은
          # 실제 자산 이름과 같아야 하므로 여기서도 같은 치환을 한다.
          url=${name// /.}
          # 크기와 해시는 node로 구한다. electron-updater는 sha512를 base64로 읽는데,
          # 셸 도구로 hex→binary→base64를 거치면 Windows 러너의 Git Bash에 xxd나
          # base64가 있느냐에 릴리스가 걸린다. 없으면 set -e로 잡 전체가 죽는다.
          # node는 위 setup-node 단계가 두 러너 모두에 보장한다.
          size=$(node -e 'console.log(require("fs").statSync(process.argv[1]).size)' "$artifact")
          sha=$(node -e 'const c=require("crypto"),f=require("fs");console.log(c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' "$artifact")
          cat > "$manifest" <<EOF
          version: $version
          files:
            - url: $url
              sha512: $sha
              size: $size
          path: $url
          sha512: $sha
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          EOF
          gh release upload "$GITHUB_REF_NAME" "$manifest" --clobber

      - name: Upload bundles as artifacts (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.platform.target }}
          path: src-tauri/target/release/bundle/**
          retention-days: 7

      # flatpak/snap 잡은 GitHub 릴리스가 아니라 이 워크플로 아티팩트에서 .deb를
      # 가져온다 (태그 push와 workflow_dispatch 양쪽에서 동일하게 소비 가능하도록
      # 이벤트 종류와 무관하게 매번 업로드한다).
      - name: Upload deb artifact (linux only)
        if: matrix.platform.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-deb-linux
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 3

  build-flatpak:
    name: Build Flatpak bundle
    needs: build-tauri
    # 24.04 필수: 22.04의 flatpak-builder 1.2대는 구식 appstream-compose를 호출하는데
    # GNOME SDK 49에는 그 바이너리가 없다(appstreamcli compose로 대체됨). 이 잡은
    # 이미 빌드된 deb를 재패키징만 하므로 glibc 2.35 고정(빌드 잡)과 무관하다.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: tauri-deb-linux
          path: flatpak/

      - name: Prepare sources
        run: |
          mv flatpak/*.deb flatpak/qcalc.deb
          mkdir -p flatpak/icons
          cp src-tauri/icons/128x128@2x.png flatpak/icons/io.github.from104.qcalc.png

      - name: Setup Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # 46은 Flathub에서 EOL 제거됨(2026-08 실측: 49·50만 제공) — 매니페스트와 동기 유지
          flatpak install -y --user flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Build Flatpak
        run: |
          cd flatpak
          flatpak-builder --force-clean --user --install-deps-from=flathub --disable-updates --repo=repo .flatpak-builder/build io.github.from104.qcalc.yml

      - name: Bundle
        run: |
          cd flatpak
          VER=$(node -p "require('../package.json').version")
          flatpak build-bundle repo "QCalc-${VER}-linux.flatpak" io.github.from104.qcalc

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" flatpak/QCalc-*.flatpak --clobber

      - name: Upload artifact (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: flatpak/QCalc-*.flatpak
          retention-days: 7

  build-snap:
    name: Build Snap bundle
    needs: build-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: tauri-deb-linux
          path: snap/local/

      - name: Rename deb
        run: mv snap/local/*.deb snap/local/qcalc.deb

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapbuild

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.snapbuild.outputs.snap }}" --clobber

      - name: Upload artifact (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: snap-bundle
          path: ${{ steps.snapbuild.outputs.snap }}
          retention-days: 7

  build-android:
    name: Build Android APK
    # 데스크톱 빌드에 의존하지 않는다 — 소스에서 독립적으로 빌드하므로 병렬로 돈다.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # app/capacitor.build.gradle 이 sourceCompatibility 21 을 요구한다.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # src-capacitor 는 루트와 별개의 yarn 프로젝트다(자체 yarn.lock).
      # Quasar 가 cap sync 를 돌리려면 양쪽 모두 설치돼 있어야 한다.
      - name: Install JS dependencies
        run: |
          yarn install --immutable
          (cd src-capacitor && yarn install --immutable)

      - name: Verify signing secrets are configured
        env:
          MY_JKS_BASE64: ${{ secrets.MY_JKS_BASE64 }}
          MY_JKS_STORE_PASSWORD: ${{ secrets.MY_JKS_STORE_PASSWORD }}
          MY_JKS_KEY_ALIAS: ${{ secrets.MY_JKS_KEY_ALIAS }}
          MY_JKS_KEY_PASSWORD: ${{ secrets.MY_JKS_KEY_PASSWORD }}
        run: |
          missing=""
          for name in MY_JKS_BASE64 MY_JKS_STORE_PASSWORD MY_JKS_KEY_ALIAS MY_JKS_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::안드로이드 서명 시크릿이 설정되지 않았습니다:$missing"
            echo "::error::Repo Settings > Secrets and variables > Actions 에서 추가하세요."
            exit 1
          fi

      # 워크스페이스 밖($RUNNER_TEMP)에 풀어 빌드 산출물에 딸려 들어갈 여지를 없앤다.
      - name: Decode signing keystore
        env:
          MY_JKS_BASE64: ${{ secrets.MY_JKS_BASE64 }}
        run: |
          printf '%s' "$MY_JKS_BASE64" | base64 -d > "$RUNNER_TEMP/qcalc-release.jks"
          test -s "$RUNNER_TEMP/qcalc-release.jks"

      - name: Build signed APK
        env:
          MY_JKS_KEY_FILE: ${{ runner.temp }}/qcalc-release.jks
          MY_JKS_STORE_PASSWORD: ${{ secrets.MY_JKS_STORE_PASSWORD }}
          MY_JKS_KEY_ALIAS: ${{ secrets.MY_JKS_KEY_ALIAS }}
          MY_JKS_KEY_PASSWORD: ${{ secrets.MY_JKS_KEY_PASSWORD }}
        run: yarn build:android

      # versionCode/versionName 은 app/build.gradle 이 루트 package.json 에서 끌어온다.
      # 그 배선이 끊기면 예전처럼 낡은 버전이 박힌 APK 가 조용히 나가므로 여기서 못박는다.
      - name: Package and verify APK
        id: apk
        run: |
          VER=$(node -p "require('./package.json').version")
          OUT="QCalc-${VER}-android.apk"
          cp src-capacitor/android/app/build/outputs/apk/release/app-release.apk "$OUT"

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$OUT" | head -1)
          echo "$BADGING"
          case "$BADGING" in
            *"versionName='${VER}'"*) ;;
            *)
              echo "::error::APK 버전이 package.json(${VER})과 다릅니다: $BADGING"
              exit 1
              ;;
          esac

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 이 잡은 데스크톱 빌드와 병렬로 돌지만, draft 릴리스를 만드는 것은 build-tauri 의
          # tauri-action 이다. APK 는 4분, 데스크톱은 8~10분이 걸려 여기까지 먼저 도착하고,
          # 그러면 업로드가 `release not found` 로 죽는다 — 0.13.1 에서 실제로 그랬다.
          # (flatpak·snap 잡은 deb 아티팩트 때문에 build-tauri 를 needs 로 걸어 두어 이
          # 문제가 없었다. 여기만 독립적이라 드러났다.)
          #
          # 릴리스가 생길 때까지 기다린다. 잡 전체를 needs 로 묶으면 APK 빌드까지 10분
          # 늦어지므로, 병렬 빌드는 그대로 두고 업로드만 늦춘다.
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
              exit 0
            fi
            echo "draft 릴리스를 기다리는 중... ($i/60)"
            sleep 30
          done
          echo "::error::30분을 기다려도 릴리스 $GITHUB_REF_NAME 이 생기지 않았다"
          exit 1

      - name: Upload artifact (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/qcalc-release.jks"
