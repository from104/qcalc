name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Test with coverage
        run: yarn test:coverage

  build-electron:
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Electron (linux-unpacked)
        run: npx quasar build -m electron --publish never

      - name: Verify build output
        run: test -d dist/electron/Packaged/linux-unpacked

      - name: Upload linux-unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-unpacked
          path: dist/electron/Packaged/linux-unpacked/
          retention-days: 3
