name: qcalc
# glibc 정렬: 배포 .deb는 ubuntu-22.04(glibc 2.35)에서 빌드하므로 core22(glibc 2.35)와
# 짝을 맞춘다. release.yml의 build-tauri 러너를 바꾸면 이 base도 함께 바꿔야 한다.
base: core22
adopt-info: qcalc
summary: A multi-purpose calculator for productivity and accessibility
description: |
  QCalc packs 5 specialized calculators and 10 languages into one clean,
  keyboard-friendly app: standard arithmetic, unit conversion, currency
  exchange, programmer/radix math, and formula evaluation.
grade: stable
confinement: strict
# 압축은 기본값(xz)을 쓴다. lzo는 기동이 조금 빠른 대신 이 앱에서 용량이
# 128MB -> 171MB로 커진다(실측). 계산기 앱에서 그 43MB를 정당화할 만한
# 이득이 아니다.
#
# 주의: 스토어 자동심사의 squashfs_repack_checksum 실패는 이 설정과 무관하다.
# 한때 그렇게 판단했으나 xz 재빌드에서 그대로 재현되어 반증됐다. 실제 원인은
# CI의 패키징 방식이다 — 같은 파일 트리를 `snapcraft pack`으로 다시 묶으면
# 통과한다. qcalc#118 참조.
architectures:
  - build-on: amd64

apps:
  qcalc:
    command: usr/bin/qcalc
    extensions: [gnome]
    common-id: io.github.from104.qcalc
    plugs:
      - network
      - audio-playback
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
    environment:
      # WebKitGTK가 샌드박스 안에서 DMA-BUF 렌더러를 사용하면 빈 화면이 뜨는
      # 알려진 문제 회피
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      # WebKitGTK의 자체 bwrap 기반 프로세스 샌드박스가 strict confinement snap
      # 안에서 중첩되지 못해 빈 화면이 뜨는 문제 회피
      WEBKIT_DISABLE_SANDBOX: '1'

parts:
  qcalc:
    plugin: dump
    # CI가 tauri-deb-linux 아티팩트를 이 고정 경로로 배치.
    # snapcraft는 상대 source 경로를 (snap/ 이 아니라) 프로젝트 루트(CRAFT_PROJECT_DIR)
    # 기준으로 해석하므로 snap/ 접두사를 포함해야 한다.
    source: ./snap/local/qcalc.deb
    source-type: deb
    # gnome extension은 GTK/GNOME 스택은 제공하지만 WebKitGTK는 포함하지 않으므로
    # Ubuntu 아카이브 패키지로 명시한다.
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    # GL/EGL 스택은 gnome extension(gnome-42-2204)이 제공한다. libwebkit2gtk가
    # 딸고 오는 Mesa를 함께 실으면 snap 쪽이 LD_LIBRARY_PATH 앞자리라 먼저 로드되고,
    # 플랫폼의 DRI 드라이버와 어긋나 EGL 초기화가 실패한다:
    #   libEGL fatal: did not find extension DRI_Mesa version 1
    # 그러면 앱이 창을 띄우지 못하고 종료한다. 빼면 플랫폼 것을 쓰고 정상 기동한다.
    stage:
      - -usr/lib/x86_64-linux-gnu/dri
      - -usr/lib/x86_64-linux-gnu/libEGL*
      - -usr/lib/x86_64-linux-gnu/libGL*
      - -usr/lib/x86_64-linux-gnu/libGLES*
      - -usr/lib/x86_64-linux-gnu/libGLX*
      - -usr/lib/x86_64-linux-gnu/libglapi*
      - -usr/lib/x86_64-linux-gnu/libgbm*
    override-build: |
      craftctl default
      craftctl set version="$(grep -m1 '"version"' "$CRAFT_PROJECT_DIR/package.json" | cut -d'"' -f4)"
      # deb는 tauri.conf.json의 mainBinaryName대로 usr/bin/qcalc을 설치한다. 이름이
      # 이미 맞으므로 여기서 옮길 것은 없고, 있는지만 확인한다.
      #
      # 확인을 지우지 말 것. 예전에는 이 자리에서 "usr/bin/의 첫 번째 파일"을 qcalc으로
      # 이름을 바꿨는데, stage-packages가 같은 디렉터리에 bwrap·fc-cache·debconf를 함께
      # 넣는 탓에 bubblewrap이 뽑혀 **앱이 한 번도 뜨지 않은 채 릴리스됐다**(#117).
      # 빌드는 그때도 성공했다 — 실패해야 할 곳에서 실패하게 만드는 것이 이 한 줄이다.
      test -x "$CRAFT_PART_INSTALL/usr/bin/qcalc"
