id: io.github.from104.qcalc
runtime: org.gnome.Platform
# 46은 Flathub에서 EOL로 제거됨(2026-08 기준 49·50만 제공). 49에 webkit2gtk-4.1
# 포함을 실측 확인함(libwebkit2gtk-4.1.so.0.21.9).
runtime-version: '49'
sdk: org.gnome.Sdk

# org.gnome.Platform 런타임은 WebKitGTK(webkit2gtk-4.1)를 내장하므로 별도 webkit
# module을 빌드하지 않는다. org.freedesktop.Platform에는 WebKitGTK가 없다.
command: qcalc

finish-args:
  # 디스플레이 (Wayland 우선, X11 fallback)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU 가속
  - --device=dri
  # 네트워크 (환율 정보 업데이트용)
  - --share=network
  # 오디오 (버튼 사운드)
  - --socket=pulseaudio
  # WebKitGTK가 샌드박스 안에서 DMA-BUF 렌더러를 사용하면 빈 화면이 뜨는
  # 알려진 문제 회피 (https://gitlab.gnome.org/GNOME/epiphany/-/issues/2074 등)
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

modules:
  - name: qcalc
    buildsystem: simple
    sources:
      # CI가 tauri-deb-linux 아티팩트를 이 고정 이름으로 배치
      - type: file
        path: qcalc.deb
      # desktop 파일
      - type: file
        path: io.github.from104.qcalc.desktop
      # metainfo 파일
      - type: file
        path: io.github.from104.qcalc.metainfo.xml
      # 아이콘 파일 (CI가 src-tauri/icons/128x128@2x.png를 복사)
      - type: file
        path: icons/io.github.from104.qcalc.png
    build-commands:
      # .deb 압축 해제 (data.tar.*는 zstd/gz/xz 등 압축 방식에 따라 확장자가 다름)
      - ar -x qcalc.deb
      - tar -xf data.tar.*
      # 바이너리 설치. productName("Q Calc")에 공백이 포함되어 있어 usr/bin/ 안의
      # 실제 파일명이 mainBinaryName 설정 여부에 따라 달라질 수 있으므로, glob으로
      # 단일 바이너리를 찾아 고정 이름(qcalc)으로 설치한다.
      - install -Dm755 usr/bin/* /app/bin/qcalc
      # desktop 파일 설치 (deb에 포함된 것 대신 이 매니페스트의 것을 사용)
      - install -Dm644 io.github.from104.qcalc.desktop /app/share/applications/io.github.from104.qcalc.desktop
      # metainfo 설치
      - install -Dm644 io.github.from104.qcalc.metainfo.xml /app/share/metainfo/io.github.from104.qcalc.metainfo.xml
      # 아이콘 설치 (256x256). type:file 소스는 path의 서브디렉토리(icons/)를
      # 보존하지 않고 basename으로 빌드 디렉토리 루트에 복사되므로 basename으로 참조한다.
      - install -Dm644 io.github.from104.qcalc.png /app/share/icons/hicolor/256x256/apps/io.github.from104.qcalc.png
