[package]
name = "app"
version = "0.1.0"
description = "A multi-purpose calculator for productivity and accessibility"
authors = ["Kihyun Seo <from104@gmail.com>"]
license = "MIT"
repository = "https://github.com/from104/qcalc"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

# announce_a11y 커맨드가 GTK 창의 접근성 객체에 ATK announcement 신호를 쏘는 데 사용.
# tauri(tao/wry)가 이미 같은 0.18 계열을 끌어오므로 새 네이티브 의존성은 아니다.
[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"

# read_clipboard_text 커맨드의 Windows 경로 — WebView2 readText()의 권한 요청을 거치지 않는다.
[target."cfg(windows)".dependencies]
clipboard-win = "5"
# 종료 직전 WebView2 브라우저 프로세스를 기다리는 데 사용(windows_exit). webview2-com과 같은 0.61이라 새로 빌드되는 것은 없다.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
